# docker-compose.observability.yml — Optional observability overlay for Plantry
#
# Adds a self-contained grafana/otel-lgtm stack (OTel Collector + Loki + Tempo +
# Prometheus + Grafana) as an opt-in overlay.  When active it receives OTLP signals
# from plantry-web and provides a Grafana UI for querying traces, metrics, and logs.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Grafana is available at http://127.0.0.1:3000 (localhost-only — NOT exposed to the
# internet).  To reach it from your workstation over SSH:
#   ssh -L 3000:127.0.0.1:3000 your-host
# then open http://localhost:3000 in your browser.
#
# Default credentials (change via GF_SECURITY_ADMIN_PASSWORD in .env):
#   user: admin
#   pass: set GF_SECURITY_ADMIN_PASSWORD in .env (no default accepted)
#
# Footprint: ~0.5-1 GB RAM + an lgtm_data volume on the host.
# Retention: configure PROMETHEUS_RETENTION_TIME and LOKI_RETENTION_PERIOD in .env
# (interpolated into PROMETHEUS_EXTRA_ARGS / LOKI_EXTRA_ARGS respectively — see
# .env.example). Loki's compactor now enforces this window (plantry-032n) — see the
# `lgtm` service's LOKI_EXTRA_ARGS comment below for the flag details.
# Tempo block-retention is not exposed via CLI in the bundled otel-lgtm image; its
# built-in default applies. See .env.example for details.
#
# Alternative — point at a SaaS OTLP endpoint instead of this container:
#   Do NOT use this overlay.  Instead set OTEL_EXPORTER_OTLP_ENDPOINT and
#   OTEL_EXPORTER_OTLP_HEADERS in .env and add them to plantry-web in a local
#   override (or set them on the host before docker compose up -d).
#   See docs/Operations/self-hosting.md — Observability section.

services:

  # ── Plantry Web (OTLP wiring) ─────────────────────────────────────────────
  # Adds the OTEL_* env vars so plantry-web emits OTLP signals to the lgtm
  # sidecar.  ServiceDefaults already auto-enables the OTLP exporter when
  # OTEL_EXPORTER_OTLP_ENDPOINT is set — no app code change required.
  plantry-web:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    depends_on:
      # service_started, not service_healthy: lgtm's healthcheck is a detection
      # signal only, not a startup gate — see the amendment under ADR-016
      # Decision 2. A dead Loki/OTLP receiver must never block plantry-web from
      # starting; the .NET OTLP exporter buffers and retries against a
      # not-yet-ready collector. (plantry-kfjj)
      lgtm:
        condition: service_started

  # ── LGTM (OTel Collector + Loki + Tempo + Prometheus + Grafana) ───────────
  # Single-binary all-in-one observability stack from Grafana Labs.
  # Receives OTLP via HTTP on port 4318 (grpc on 4317 is also accepted but
  # unused here — http/protobuf avoids an extra gRPC dependency in the web app).
  # Grafana listens on 3000 — bound to localhost only (security: never expose
  # a raw, potentially unauthenticated Grafana port to the internet).
  # Documented by Grafana as suited for single-node / development use; acceptable
  # for a single-household VPS (ADR-016).  Upgrade path if outgrown: SigNoz or
  # Uptrace (ClickHouse-backed, production-grade, heavier).
  lgtm:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    environment:
      # Grafana admin password — REQUIRED. No default is accepted; set this in .env.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      # Retention bounds — keep disk usage finite on a shared VPS.
      # CLI-flag passthrough via *_EXTRA_ARGS is a valid mechanism for these bundled
      # daemons — confirmed working for Prometheus below (--storage.tsdb.retention.time).
      # It is NOT safe to assume a flag name by guessing from the YAML config key: Loki
      # has no `-limits.retention-period` flag (its YAML key `limits_config.retention_period`
      # doesn't have a same-named CLI flag) — Loki 3.7.1 rejects it at startup with
      # "flag provided but not defined", which took the whole Loki process down (plantry-e4z0).
      # The real flag is `-store.retention`, and it additionally needs compactor flags to
      # actually take effect: `-compactor.retention-enabled` turns retention sweeps on,
      # `-compactor.working-directory` must be pointed under the persisted `/data` volume
      # (its own default of /var/loki/compactor is NOT under lgtm_data and loses compactor
      # state on container recreation), and `-compactor.delete-request-store` is required
      # by Loki 3.7.1 whenever retention is enabled — set to `filesystem` to match this
      # image's baked-in `schema_config.configs[0].object_store: filesystem` (the only
      # object store configured here). Verified together via `loki -verify-config`
      # (plantry-032n). Before adding a flag for any of these daemons (including
      # Tempo/Pyroscope below), verify it against that binary's own `--help` inside the
      # container — don't assume passthrough behaves identically across all of them.
      PROMETHEUS_EXTRA_ARGS: "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}"
      LOKI_EXTRA_ARGS: "--store.retention=${LOKI_RETENTION_PERIOD:-744h} --compactor.retention-enabled=true --compactor.working-directory=/data/loki/compactor --compactor.delete-request-store=filesystem"
      # Note: Tempo retention in otel-lgtm is controlled by its built-in block
      # retention config.  OTEL_TEMPO_RETENTION is documented in .env.example as
      # a user-facing label only; pass it as TEMPO_EXTRA_ARGS if the bundled Tempo
      # version supports --block-retention (v2.x does not expose this as a flag —
      # the default retention of the bundled version applies until otel-lgtm exposes
      # a supported knob or is upgraded to a version that does).
    ports:
      # Bind Grafana to localhost only — routing through Caddy or an SSH tunnel
      # is required to reach it from outside the host.
      - "127.0.0.1:3000:3000"
    volumes:
      - lgtm_data:/data
    healthcheck:
      # curl-minimal is present in the grafana/otel-lgtm image (wget is not).
      # -sf: -s silent, -f fail on HTTP error → exit 1 on non-2xx.
      #
      # Probes Grafana, Loki, and the OTel collector's OTLP/HTTP receiver —
      # deliberately NOT Tempo, Pyroscope, or Prometheus (plantry-kfjj). Loki is
      # the daemon that has actually died in production (plantry-e4z0); the OTLP
      # receiver on 4318 is the ingest path, so its death is the worst silent
      # failure — nothing reaches any backend. Each additional probe is a new
      # flake source with its own readiness path to verify, and losing Tempo/
      # Pyroscope/Prometheus costs less than losing either daemon in scope. Do
      # not "helpfully" add the rest without re-litigating that trade-off.
      #
      # Loki: GET /ready on 3100 returns 200 when ready, 503 while starting
      # (start_period covers this) or when down — verified inside a running
      # grafana/otel-lgtm container (plantry-kfjj). -sf is correct here: a
      # non-2xx status is a real failure signal.
      #
      # OTel collector: GET / on 4318 (the OTLP/HTTP receiver) returns 404 when
      # the receiver is up — there is no dedicated health path, so any HTTP
      # response (even an error status) proves the process is listening.
      # Deliberately no -f here: with -f a steady-state 404 would always "fail"
      # the probe. A dead receiver instead refuses the connection (curl exit 7),
      # which still fails the chain via the trailing `|| exit 1`.
      #
      # This healthcheck reports detection status only — it does NOT gate
      # plantry-web's startup (see the lgtm depends_on entry above).
      test:
        - "CMD-SHELL"
        - "curl -sf http://localhost:3000/api/health && curl -sf http://localhost:3100/ready && curl -s -o /dev/null http://localhost:4318/ || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  lgtm_data:
