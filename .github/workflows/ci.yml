name: CI

# Required per-PR candidate gate. The five .NET suites run serially because
# Integration and Aspire E2E both own Docker-backed infrastructure.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Keep the `fast` job name stable for existing branch-protection rules.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build full solution
        run: dotnet build --no-restore --configuration Release

      # Run each suite in its own step, in this order. Never matrix or parallelize these.
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/Plantry.Tests.Unit.log"
          dotnet test tests/Plantry.Tests.Unit --no-build --configuration Release --logger "console;verbosity=normal" 2>&1 | tee "$log"
          grep -Eq '^[[:space:]]*Passed:[[:space:]]*[1-9][0-9]*' "$log" || { echo 'Unit suite passed zero tests or emitted no passed count.'; exit 1; }

      - name: Integration tests
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/Plantry.Tests.Integration.log"
          dotnet test tests/Plantry.Tests.Integration --no-build --configuration Release --logger "console;verbosity=normal" 2>&1 | tee "$log"
          grep -Eq '^[[:space:]]*Passed:[[:space:]]*[1-9][0-9]*' "$log" || { echo 'Integration suite passed zero tests or emitted no passed count.'; exit 1; }

      - name: Web tests
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/Plantry.Tests.Web.log"
          dotnet test tests/Plantry.Tests.Web --no-build --configuration Release --logger "console;verbosity=normal" 2>&1 | tee "$log"
          grep -Eq '^[[:space:]]*Passed:[[:space:]]*[1-9][0-9]*' "$log" || { echo 'Web suite passed zero tests or emitted no passed count.'; exit 1; }

      - name: Architecture tests
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/Plantry.Tests.Architecture.log"
          dotnet test tests/Plantry.Tests.Architecture --no-build --configuration Release --logger "console;verbosity=normal" 2>&1 | tee "$log"
          grep -Eq '^[[:space:]]*Passed:[[:space:]]*[1-9][0-9]*' "$log" || { echo 'Architecture suite passed zero tests or emitted no passed count.'; exit 1; }

      - name: Install Playwright Chromium
        run: >
          pwsh tests/Plantry.Tests.E2E/bin/Release/net10.0/playwright.ps1
          install chromium --with-deps

      - name: Aspire E2E tests
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/Plantry.Tests.E2E.log"
          dotnet test tests/Plantry.Tests.E2E --no-build --configuration Release --logger "console;verbosity=normal" 2>&1 | tee "$log"
          grep -Eq '^[[:space:]]*Passed:[[:space:]]*[1-9][0-9]*' "$log" || { echo 'Aspire E2E suite passed zero tests or emitted no passed count.'; exit 1; }

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: "**/trace.zip"
          retention-days: 7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Island JavaScript tests
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/island-js-tests.log"
          npm test 2>&1 | tee "$log"
          grep -Eq '^[^a-zA-Z0-9]*pass[[:space:]]+[1-9][0-9]*' "$log" || { echo 'Island JS suite passed zero tests or emitted no passed count.'; exit 1; }
